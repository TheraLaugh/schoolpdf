<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — نموذج التقييم</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; line-height: 1.6;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: #1e293b; border-bottom: 1px solid #334155;
    position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .status {
    display: flex; gap: 16px; font-size: 12px; color: #94a3b8; align-items: center;
  }
  .status .item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .dot.dirty { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite alternate; }
  .dot.err { background: #ef4444; }
  @keyframes pulse { from { opacity: .4 } to { opacity: 1 } }

  .icon-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 14px; padding: 24px; max-width: 1300px; margin: 0 auto;
  }
  .icon-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    padding: 22px 12px 18px; cursor: pointer; text-align: center;
    transition: all .2s ease; display: flex; flex-direction: column;
    align-items: center; gap: 10px; color: inherit;
    font-family: inherit; font-size: 13.5px;
  }
  .icon-card:hover {
    background: #334155; border-color: #6366f1; transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(99,102,241,0.25);
  }
  .icon-card .icon { font-size: 34px; line-height: 1; }
  .icon-card .label { font-weight: 600; color: #cbd5e1; }
  .icon-card .sub { font-size: 11px; color: #64748b; }

  /* Modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(2,6,23,0.82);
    backdrop-filter: blur(4px); z-index: 100; padding: 20px; overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; }
  .modal {
    background: #1e293b; border-radius: 16px; width: 100%; max-width: 720px;
    border: 1px solid #334155; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-height: calc(100vh - 80px); display: flex; flex-direction: column;
    animation: modalIn .22s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .modal.md { max-width: 720px; }
  .modal.lg { max-width: 1000px; }
  .modal.xl { max-width: 1300px; height: calc(100vh - 80px); }
  .modal-header {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    border-bottom: 1px solid #334155;
  }
  .modal-header .mh-icon { font-size: 24px; }
  .modal-header h3 { margin: 0; font-size: 16px; flex: 1; color: #f1f5f9; }
  .close-btn {
    background: transparent; border: none; color: #94a3b8; font-size: 22px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1;
  }
  .close-btn:hover { background: #334155; color: #f1f5f9; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

  /* Form controls */
  label.fld-label { display: block; font-size: 12px; color: #94a3b8; margin: 12px 0 6px; font-weight: 600; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #475569; border-radius: 8px;
    background: #0f172a; color: #e2e8f0; font-family: inherit; font-size: 13.5px;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }
  textarea { resize: vertical; min-height: 80px; }
  textarea.code {
    font-family: 'Consolas', 'Menlo', monospace; direction: ltr; text-align: left;
    min-height: 320px; font-size: 12.5px; line-height: 1.55;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 11.5px; color: #64748b; margin-top: 4px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 8px; border: 1px solid transparent;
    font-family: inherit; font-size: 13.5px; cursor: pointer;
    background: #334155; color: #e2e8f0; transition: background .15s;
  }
  .btn:hover { background: #475569; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-success { background: #22c55e; color: #052e16; }
  .btn-success:hover { background: #16a34a; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-danger:hover  { background: #dc2626; }
  .btn-ghost   { background: transparent; border-color: #475569; }
  .btn-ghost:hover { background: #334155; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  /* Domain editor card */
  .domain-card {
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    padding: 12px; margin: 10px 0; position: relative;
  }
  .domain-card .dom-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .domain-card .dom-index {
    background: #6366f1; color: #fff; border-radius: 6px; padding: 2px 9px;
    font-size: 11.5px; font-weight: 700;
  }
  .remove-btn {
    background: transparent; border: 1px solid #7f1d1d; color: #fca5a5;
    border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
  }
  .remove-btn:hover { background: #7f1d1d; color: #fff; }
  .add-btn {
    background: #1e40af; border: 1px dashed #6366f1; color: #93c5fd;
    border-radius: 8px; padding: 10px; width: 100%; cursor: pointer;
    font-family: inherit; font-size: 13px; margin-top: 8px;
  }
  .add-btn:hover { background: #1e3a8a; }

  /* Theme cards */
  .theme-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
  }
  .theme-card {
    border: 2px solid #334155; border-radius: 10px; overflow: hidden;
    cursor: pointer; transition: all .15s; background: #0f172a;
  }
  .theme-card:hover { border-color: #475569; }
  .theme-card.selected { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.3); }
  .theme-card .tp {
    height: 100px; padding: 10px; font-size: 9px; position: relative;
    display: flex; flex-direction: column; gap: 3px;
  }
  .theme-card .tp .bar { height: 6px; border-radius: 2px; }
  .theme-card .tp .tbl { border-collapse: collapse; width: 100%; margin-top: 4px; }
  .theme-card .tp .tbl td { border: 1px solid; padding: 2px 4px; font-size: 8px; }
  .theme-card .tname {
    text-align: center; padding: 6px; background: #1e293b; font-size: 12px;
    font-weight: 600; color: #cbd5e1; border-top: 1px solid #334155;
  }

  .toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 11px 20px; border-radius: 8px; background: #1e293b;
    border: 1px solid #475569; color: #e2e8f0; font-size: 13.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: toastIn .22s ease;
  }
  .toast.ok  { border-color: #22c55e; }
  .toast.err { border-color: #ef4444; }
  .toast.warn { border-color: #f59e0b; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  iframe.preview-frame {
    width: 100%; height: calc(100vh - 190px); border: none;
    background: #fff; border-radius: 8px;
  }

  .ai-prompt-box {
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    padding: 14px; font-family: 'Consolas', monospace; direction: ltr; text-align: left;
    max-height: 380px; overflow-y: auto; white-space: pre-wrap;
    font-size: 12.5px; line-height: 1.6; color: #cbd5e1;
  }

  @media (max-width: 640px) {
    .icon-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 14px; }
    .icon-card { padding: 16px 8px; }
    .icon-card .icon { font-size: 26px; }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">⚙</div>
    <span>لوحة الإدارة</span>
  </div>
  <div class="status">
    <div class="item"><span class="dot" id="stDot"></span><span id="stText">لم يتم التحميل</span></div>
    <div class="item">SHA: <code id="stSha" style="color:#93c5fd">—</code></div>
    <div class="item">تعديلات غير محفوظة: <strong id="stDirty" style="color:#22c55e">لا</strong></div>
  </div>
</div>

<div class="icon-grid" id="iconGrid"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <span class="mh-icon" id="mhIcon"></span>
      <h3 id="mhTitle"></h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-root" id="toastRoot"></div>

<script>
(function () {
  'use strict';

  /* ============ الحالة ============ */
  var state = {
    rawHtml: null,
    sha: null,
    savedData: null,
    currentData: null,
    config: { token: '', owner: 'TheraLaugh', repo: '', branch: 'main', path: 'index.html' }
  };

  /* ============ أدوات ============ */
  function $(id) { return document.getElementById(id); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function isDirty() {
    if (!state.savedData || !state.currentData) return false;
    try { return JSON.stringify(state.savedData) !== JSON.stringify(state.currentData); }
    catch (e) { return false; }
  }
  function toast(msg, type) {
    var t = document.createElement('div');
    t.className = 'toast ' + (type || 'ok');
    t.textContent = msg;
    $('toastRoot').appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2600);
    setTimeout(function () { t.remove(); }, 3000);
  }
  function updateStatus(text, cls) {
    $('stText').textContent = text;
    $('stDot').className = 'dot ' + (cls || '');
    $('stSha').textContent = state.sha ? state.sha.substring(0, 7) : '—';
    var dirty = isDirty();
    $('stDirty').textContent = dirty ? 'نعم' : 'لا';
    $('stDirty').style.color = dirty ? '#f59e0b' : '#22c55e';
    if (dirty) { $('stDot').className = 'dot dirty'; }
  }
  function b64Encode(str) {
    var bytes = new TextEncoder().encode(str), bin = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk)
      bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
    return btoa(bin);
  }
  function b64Decode(b64) {
    var bin = atob(String(b64).replace(/\s/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function extractData(html) {
    var m = html.match(/<script\s+id="app-data"\s+type="application\/json"[^>]*>([\s\S]*?)<\/script>/i);
    if (!m) throw new Error('لم يتم العثور على كتلة app-data');
    return JSON.parse(m[1]);
  }
  function injectData(html, data) {
    var json = JSON.stringify(data, null, 2)
      .replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
    return html.replace(
      /(<script\s+id="app-data"\s+type="application\/json"[^>]*>)[\s\S]*?(<\/script>)/i,
      function (m, o, c) { return o + '\n' + json + '\n' + c; }
    );
  }

  /* ============ إعدادات محفوظة ============ */
  function loadConfig() {
    try {
      var s = localStorage.getItem('evalAdminCfg_v2');
      if (s) state.config = Object.assign(state.config, JSON.parse(s));
    } catch (e) {}
  }
  function saveConfig() {
    localStorage.setItem('evalAdminCfg_v2', JSON.stringify(state.config));
  }
  function ensureInit() {
    if (!state.currentData) {
      state.currentData = getBlankTemplate();
      state.savedData = clone(state.currentData);
    }
  }
  function getBlankTemplate() {
    return {
      meta: { title: "نموذج تقييم الأداء الشامل للمعلمة", schoolYear: "العام الدراسي: ............", evalDate: "تاريخ التقييم: ............" },
      theme: "classic",
      basicInfo: { teacherName: "", specialty: "", schoolYear: "", evalDate: "" },
      gradingKey: "5 = ممتاز | 4 = جيد جداً | 3 = جيد | 2 = مقبول | 1 = ضعيف",
      sections: [
        { title: "القسم الأول: التقييم الأكاديمي والتعليمي", maxScore: 50, domains: [] },
        { title: "القسم الثاني: التقييم الإداري", maxScore: 50, domains: [] }
      ],
      criticalRule: "", resultsTitle: "ثالثاً: التقدير العام والنتائج",
      totalScoreLine: "مجموع الدرجات المستحقة: ......... من 100 درجة",
      gradeBands: [{ range: "90 - 100", label: "ممتاز" },{ range: "80 - 89", label: "جيد جداً" },{ range: "70 - 79", label: "جيد" },{ range: "50 - 69", label: "مقبول" },{ range: "أقل من 50", label: "ضعيف" }],
      calcMethod: "كل مجال يُقيّم من 1 إلى 5 ثم يُضرب في 2 للحصول على درجة من 10. مجموع القسمين = 100 درجة.",
      reportTitle: "رابعاً: التقرير الوصفي والتوصيات",
      reportSections: [],
      signaturesTitle: "خامساً: التوقيعات",
      signatures: [],
      footer: "مديرة المدرسة"
    };
  }

  /* ============ تعريف الأقسام (أيقونات) ============ */
  var SECTIONS = [
    { id:'github',   icon:'⚙️', label:'GitHub',       sub:'الإعدادات والمزامنة', build: buildGithub },
    { id:'basic',    icon:'👤', label:'البيانات',      sub:'المعلمة والعام',       build: buildBasic },
    { id:'academic', icon:'🏫', label:'الأكاديمي',     sub:'القسم الأول',          build: buildAcademic },
    { id:'adminsec', icon:'💼', label:'الإداري',       sub:'القسم الثاني',         build: buildAdminSec },
    { id:'critical', icon:'⚠️', label:'المؤشر الحرج',  sub:'قاعدة تحذيرية',        build: buildCritical },
    { id:'results',  icon:'📊', label:'النتائج',       sub:'التقدير والنطاقات',    build: buildResults },
    { id:'report',   icon:'📝', label:'التقرير',       sub:'الوصفي والتوصيات',     build: buildReport },
    { id:'sig',      icon:'✍️', label:'التوقيعات',     sub:'والتذييل',             build: buildSignatures },
    { id:'theme',    icon:'🎨', label:'الشكل',         sub:'التصميم والألوان',     build: buildTheme },
    { id:'preview',  icon:'👁',  label:'المعاينة',     sub:'عرض مباشر',            build: buildPreview },
    { id:'export',   icon:'📤', label:'التصدير',       sub:'HTML / JSON / PDF',    build: buildExport },
    { id:'rawjson',  icon:'🧩', label:'JSON خام',      sub:'تحرير متقدم',          build: buildRawJson },
    { id:'ai',       icon:'🤖', label:'مساعد AI',      sub:'برومبت ولصق',          build: buildAI }
  ];

  /* ============ شبكة الأيقونات ============ */
  function renderIconGrid() {
    var grid = $('iconGrid');
    grid.innerHTML = '';
    SECTIONS.forEach(function (sec) {
      var btn = document.createElement('button');
      btn.className = 'icon-card';
      btn.innerHTML = '<div class="icon">' + sec.icon + '</div>' +
        '<div class="label">' + sec.label + '</div>' +
        '<div class="sub">' + sec.sub + '</div>';
      btn.onclick = function () { openSection(sec.id); };
      grid.appendChild(btn);
    });
  }

  /* ============ نظام النوافذ ============ */
  function openSection(id) {
    var sec = SECTIONS.find(function (s) { return s.id === id; });
    if (!sec) return;
    ensureInit();
    $('mhIcon').textContent = sec.icon;
    $('mhTitle').textContent = sec.label;
    $('modalBox').className = 'modal ' + (sec.id === 'preview' ? 'xl' : (sec.id === 'academic' || sec.id === 'adminsec' || sec.id === 'theme' || sec.id === 'ai' ? 'lg' : 'md'));
    var body = $('modalBody');
    body.innerHTML = '';
    var result = sec.build();
    if (typeof result === 'string') body.innerHTML = result;
    else if (result instanceof Node) body.appendChild(result);
    $('modalBackdrop').classList.add('show');
  }
  function closeModal() {
    $('modalBackdrop').classList.remove('show');
  }
  window.closeModal = closeModal;
  $('modalBackdrop').addEventListener('click', function (e) {
    if (e.target === $('modalBackdrop')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ============ أدوات بناء النماذج ============ */
  function fieldRow(labelText, value, onInput, opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    var lbl = document.createElement('label');
    lbl.className = 'fld-label';
    lbl.textContent = labelText;
    wrap.appendChild(lbl);
    var inp;
    if (opts.textarea) {
      inp = document.createElement('textarea');
      inp.rows = opts.rows || 3;
      inp.value = value == null ? '' : value;
    } else {
      inp = document.createElement('input');
      inp.type = opts.type || 'text';
      inp.value = value == null ? '' : value;
    }
    inp.addEventListener('input', function () {
      onInput(inp.value);
      updateStatus('تعديل جارٍ', 'dirty');
    });
    wrap.appendChild(inp);
    if (opts.hint) {
      var h = document.createElement('div'); h.className = 'hint'; h.textContent = opts.hint;
      wrap.appendChild(h);
    }
    return wrap;
  }
  function grid2(a, b) {
    var g = document.createElement('div'); g.className = 'grid-2';
    g.appendChild(a); g.appendChild(b);
    return g;
  }
  function btn(text, cls, onClick) {
    var b = document.createElement('button');
    b.className = 'btn ' + (cls || '');
    b.textContent = text;
    b.onclick = onClick;
    return b;
  }
  function btnRow(buttons) {
    var r = document.createElement('div'); r.className = 'btn-row';
    buttons.forEach(function (b) { r.appendChild(b); });
    return r;
  }

  /* ============ GitHub ============ */
  function buildGithub() {
    var d = document.createElement('div');
    d.innerHTML = '<div style="background:#422006;border:1px solid #78350f;padding:12px;border-radius:8px;font-size:12.5px;color:#fde68a;margin-bottom:14px">' +
      '🔒 التوكن يُحفظ في متصفحك فقط ولا يُرسل إلا إلى <code>api.github.com</code>. استخدم Fine-grained token بصلاحية <em>Contents: Read and write</em>.' +
      '</div>';
    d.appendChild(fieldRow('GitHub Token', state.config.token, function (v) { state.config.token = v; }, { type: 'password', hint: 'يبدأ عادة بـ github_pat_...' }));
    d.appendChild(grid2(
      fieldRow('Owner', state.config.owner, function (v) { state.config.owner = v; }),
      fieldRow('Repository', state.config.repo, function (v) { state.config.repo = v; })
    ));
    d.appendChild(grid2(
      fieldRow('Branch', state.config.branch, function (v) { state.config.branch = v; }),
      fieldRow('File Path', state.config.path, function (v) { state.config.path = v; })
    ));
    d.appendChild(btnRow([
      btn('💾 حفظ الإعدادات', 'btn-success', function () {
        saveConfig(); toast('تم حفظ الإعدادات محلياً');
        updateStatus('الإعدادات محفوظة', 'ok');
      }),
      btn('🗑 مسح الإعدادات', 'btn-ghost', function () {
        if (!confirm('مسح الإعدادات المحفوظة؟')) return;
        state.config = { token:'', owner:'TheraLaugh', repo:'', branch:'main', path:'index.html' };
        localStorage.removeItem('evalAdminCfg_v2'); closeModal();
        toast('تم مسح الإعدادات', 'warn');
      })
    ]));
    d.appendChild(document.createElement('hr')).style.cssText = 'border:none;border-top:1px solid #334155;margin:18px 0';
    d.appendChild(btnRow([
      btn('⬇ تحميل من GitHub', 'btn-primary', loadFromGitHub),
      btn('📂 استيراد ملف محلي', 'btn-ghost', loadLocalFile)
    ]));
    d.appendChild(btnRow([
      btn('⬆ حفظ إلى GitHub', 'btn-success', saveToGitHub),
      btn('💾 تنزيل index.html', 'btn', downloadHtml),
      btn('↺ إعادة تعيين من النسخة المحفوظة', 'btn-ghost', function () {
        if (!confirm('إلغاء التعديلات والعودة لآخر نسخة محفوظة؟')) return;
        if (!state.savedData) return toast('لا توجد نسخة محفوظة', 'warn');
        state.currentData = clone(state.savedData);
        updateStatus('تمت إعادة التعيين', 'ok');
        toast('تمت إعادة التعيين');
      })
    ]));

  function downloadHtml() {
    var html = state.rawHtml ? injectData(state.rawHtml, state.currentData) : buildStandaloneHtml(state.currentData);
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
    toast('تم تنزيل index.html', 'ok');
  }
  function downloadJson() {
    var blob = new Blob([JSON.stringify(state.currentData, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'app-data.json';
    a.click();
    toast('تم تنزيل JSON', 'ok');
  }

    var w = window.open('', '_blank');

    var ta = document.createElement('textarea');

    status.style.cssText = 'font-size:12px;margin-top:8px;min-height:18px';

    function validate() {
      try {
        var v = JSON.parse(ta.value);
        status.textContent = '✅ JSON صالح';
        status.style.color = '#22c55e';
        return v;
      } catch (e) {
        status.textContent = '❌ ' + e.message;

        return null;
      }

        toast('تم تطبيق JSON', 'ok');
      })
    ]));
    return d;
  }

      try {
        var v = JSON.parse(ta.value);
        status.textContent = '✅ صالح — اضغط تطبيق';
        status.style.color = '#22c55e';
        return v;
      } catch (e) {
        status.textContent = '❌ ' + e.message;
        status.style.color = '#ef4444';
        return null;
      }
    }
    ta.addEventListener('input', validate);

    d.appendChild(btnRow([
      btn('✅ تطبيق JSON من AI', 'btn-success', function () {
        var v = validate(); if (!v) return toast('JSON غير صالح', 'err');
        if (!v.meta || !v.sections) return toast('البنية ناقصة — تحقق من meta و sections', 'err');
        state.currentData = v; closeModal(); updateStatus('تعديل جارٍ','dirty');
        toast('تم تطبيق رد الذكاء الاصطناعي', 'ok');
      })
    ]));

    return d;
  }

  /* ============ GitHub عمليات ============ */
  async function loadFromGitHub() {
    if (!state.config.token || !state.config.owner || !state.config.repo) {
      return toast('أكمل إعدادات GitHub أولاً', 'warn');
    }
    updateStatus('جارٍ التحميل...', '');
    try {
      var url = 'https://api.github.com/repos/' + encodeURIComponent(state.config.owner) +
        '/' + encodeURIComponent(state.config.repo) + '/contents/' +
        encodeURIComponent(state.config.path) + '?ref=' + encodeURIComponent(state.config.branch);
      var res = await fetch(url, {
        headers: { 'Authorization': 'Bearer ' + state.config.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()).substring(0, 200));
      var meta = await res.json();
      var html = b64Decode(meta.content);
      state.rawHtml = html;
      state.sha = meta.sha;
      state.savedData = extractData(html);
      state.currentData = clone(state.savedData);
      updateStatus('تم التحميل ✓', 'ok');
      toast('تم تحميل الملف من GitHub', 'ok');
      closeModal();
    } catch (e) {
      updateStatus('فشل التحميل', 'err');
      toast('فشل: ' + e.message, 'err');
    }
  }
  async function saveToGitHub() {
    if (!state.rawHtml) return toast('حمّل الملف أولاً', 'warn');
    if (!state.config.token || !state.config.owner || !state.config.repo) return toast('أكمل إعدادات GitHub', 'warn');
    updateStatus('جارٍ الحفظ...', '');
    try {
      var newHtml = injectData(state.rawHtml, state.currentData);
      var url = 'https://api.github.com/repos/' + encodeURIComponent(state.config.owner) +
        '/' + encodeURIComponent(state.config.repo) + '/contents/' + encodeURIComponent(state.config.path);
      var body = {
        message: 'تحديث النموذج — ' + new Date().toISOString(),
        content: b64Encode(newHtml),
        branch: state.config.branch
      };
      if (state.sha) body.sha = state.sha;
      var res = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + state.config.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (await res.text()).substring(0, 200));
      var out = await res.json();
      state.sha = out.content.sha;
      state.savedData = clone(state.currentData);
      updateStatus('تم الحفظ ✓', 'ok');
      toast('تم الحفظ على GitHub', 'ok');
    } catch (e) {
      updateStatus('فشل الحفظ', 'err');
      toast('فشل: ' + e.message, 'err');
    }
  }
  function loadLocalFile() {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.html,.htm,text/html';
    input.onchange = async function (e) {
      var file = e.target.files[0]; if (!file) return;
      try {
        var html = await file.text();
        state.rawHtml = html;
        state.sha = null;
        state.savedData = extractData(html);
        state.currentData = clone(state.savedData);
        updateStatus('تم استيراد ملف محلي', 'ok');
        toast('استُورد: ' + file.name, 'ok');
        closeModal();
      } catch (e) { toast('فشل: ' + e.message, 'err'); }
    };
    input.click();
  }

  /* ============ التهيئة ============ */
  function init() {
    loadConfig();
    ensureInit();
    renderIconGrid();
    updateStatus('جاهز', '');
  }
  init();
})();
</script>
