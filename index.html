<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نموذج تقييم الأداء الشامل للمعلمة</title>
<style>
  @page { size: A4; margin: 14mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    --p:  #1a5276;
    --pd: #154360;
    --a:  #2874a6;
    --bg:#eef1f5;
    --paper: #ffffff;
    --fg: #1c2833;
    --fgm:#566573;
    --bd: #b0bec5;
    --th: #eaf2f8;
    --hl: #fff8e1;
    --hlb:#ffe082;
    --hls:#f39c12;
    --font: 'Amiri', 'Traditional Arabic', Arial, sans-serif;
  }

  /* ---------- Themes ---------- */
  body[data-theme="modern"] {
    --p:#6c5ce7; --pd:#4834d4; --a:#a29bfe; --th:#ede9ff; --hls:#6c5ce7;
  }
  body[data-theme="minimal"] {
    --p:#2d3436; --pd:#1a1d1f; --a:#636e72; --th:#f5f6fa;
    --bg:#f8f9fa; --hls:#b2bec3;
  }
  body[data-theme="academic"] {
    --p:#7b341e; --pd:#5c2412; --a:#b7791f; --th:#fdf6e3;
    --bg:#f4ecd8; --hls:#b7791f; --font:'Amiri','Times New Roman',serif;
  }
  body[data-theme="colorful"] {
    --p:#e17055; --pd:#c44536; --a:#0984e3; --th:#ffeaa7;
    --bg:#fef9ef; --hls:#e17055;
  }
  body[data-theme="dark"] {
    --p:#74b9ff; --pd:#0984e3; --a:#a29bfe;
    --bg:#0f172a; --paper:#1e293b; --fg:#e2e8f0; --fgm:#94a3b8;
    --bd:#334155; --th:#1e3a8a;
    --hl:#422006; --hlb:#78350f; --hls:#f39c12;
  }

  body {
    font-family: var(--font);
    direction: rtl; text-align: right; color: var(--fg);
    background: var(--bg); padding: 20px; line-height: 1.75; font-size: 15px;
  }
  .container {
    max-width: 900px; margin: 0 auto; background: var(--paper);
    padding: 32px 36px; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  h1 { font-size: 25px; text-align: center; color: var(--p); margin: 0 0 6px; }
  .subtitle { text-align: center; color: var(--fgm); margin-bottom: 26px; font-size: 14px; }
  h2 {
    font-size: 17px; color: var(--p); margin: 30px 0 12px;
    padding-bottom: 6px; border-bottom: 2px solid var(--p); page-break-after: avoid;
  }
  h3 { font-size: 15px; color: var(--a); margin: 18px 0 6px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; page-break-inside: avoid; }
  th, td { border: 1px solid var(--bd); padding: 9px 11px; vertical-align: top; font-size: 14px; }
  th { background: var(--th); font-weight: 700; color: var(--p); }
  td.score-col { width: 70px; text-align: center; }
  ul { margin: 4px 0; padding-right: 22px; }
  li { margin: 3px 0; }
  .critical-rule {
    background: var(--hl); border: 1px solid var(--hlb);
    border-right: 5px solid var(--hls); padding: 12px 14px;
    border-radius: 5px; margin: 18px 0; font-size: 14px; page-break-inside: avoid;
  }
  .critical-rule strong { color: var(--hls); display: block; margin-bottom: 4px; }
  .report-box {
    border: 1px dashed var(--bd); min-height: 60px;
    background: rgba(0,0,0,0.02); border-radius: 4px;
    margin: 6px 0 16px; padding: 10px;
  }
  .grade-bands { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .grade-band {
    flex: 1 1 130px; border: 1px solid var(--bd); border-radius: 5px;
    padding: 10px; text-align: center; background: var(--th);
  }
  .grade-band .range { font-weight: 700; color: var(--p); font-size: 15px; }
  .grade-band .label { font-size: 13px; color: var(--fgm); margin-top: 2px; }
  .total-line {
    font-size: 16px; font-weight: 700; color: var(--p);
    padding: 12px 14px; background: var(--th);
    border-right: 5px solid var(--p); border-radius: 4px; margin: 12px 0;
  }
  .signature-table td { text-align: center; height: 95px; vertical-align: bottom; padding-bottom: 12px; width: 50%; }
  .footer-text { text-align: center; color: var(--fgm); margin-top: 26px; font-size: 14px; font-weight: 600; }
  .no-print { text-align: center; margin: 26px 0 6px; }
  .btn {
    display: inline-block; padding: 11px 26px; background: var(--p); color: #fff;
    border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .btn:hover { background: var(--pd); }
  @media print {
    body { background: #fff; padding: 0; font-size: 13px; }
    .container { box-shadow: none; border-radius: 0; padding: 0; max-width: none; }
    .no-print { display: none !important; }
    h2 { margin-top: 22px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="form-root"></div>
  <div class="no-print">
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
  </div>
</div>

<!-- ▼▼▼ بيانات النموذج (تُعدَّل من admin.html) ▼▼▼ -->

<script>
(function () {
  'use strict';
  var data = JSON.parse(document.getElementById('app-data').textContent);
  document.body.dataset.theme = data.theme || 'classic';
  document.getElementById('form-root').innerHTML = renderForm(data);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function renderForm(d) {
    var out = [];
    out.push('<h1>' + esc(d.meta.title) + '</h1>');
    var sub = [d.meta.schoolYear, d.meta.evalDate].filter(Boolean).join(' &nbsp;|&nbsp; ');
    if (sub) out.push('<div class="subtitle">' + sub + '</div>');

    var bi = d.basicInfo || {};
    out.push('<h2>أولاً: البيانات الأساسية</h2>');
    out.push('<table>' +
      '<tr><th style="width:50%">اسم المعلمة</th><th>التخصص / المادة</th></tr>' +
      '<tr><td>' + esc(bi.teacherName) + '</td><td>' + esc(bi.specialty) + '</td></tr>' +
      '<tr><th>العام الدراسي</th><th>تاريخ التقييم</th></tr>' +
      '<tr><td>' + esc(bi.schoolYear) + '</td><td>' + esc(bi.evalDate) + '</td></tr>' +
      '</table>');
    out.push('<p style="margin:8px 0;color:var(--fgm)"><strong>مفتاح الدرجات:</strong> ' + esc(d.gradingKey) + '</p>');

    (d.sections || []).forEach(function (sec) {
      out.push('<h2>' + esc(sec.title) + ' &nbsp;(' + esc(sec.maxScore) + ' درجة)</h2>');
      out.push('<table><thead><tr>' +
        '<th style="width:28%">المجال الرئيسي</th>' +
        '<th>المؤشرات الفرعية والأداء المتوقع</th>' +
        '<th class="score-col">الدرجة (1-5)</th></tr></thead><tbody>');
      (sec.domains || []).forEach(function (dom) {
        var inds = (dom.indicators || []).map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('');
        out.push('<tr><td><strong>' + esc(dom.title) + '</strong><br><span style="color:var(--fgm)">(' + esc(dom.score) + ' درجات)</span></td>' +
          '<td><ul>' + inds + '</ul></td><td class="score-col"></td></tr>');
      });
      out.push('</tbody></table>');
    });

    if (d.criticalRule) out.push('<div class="critical-rule"><strong>⚠ قاعدة المؤشر الحرج</strong>' + esc(d.criticalRule) + '</div>');

    out.push('<h2>' + esc(d.resultsTitle) + '</h2>');
    out.push('<div class="total-line">' + esc(d.totalScoreLine) + '</div>');
    if (d.gradeBands && d.gradeBands.length) {
      out.push('<div class="grade-bands">');
      d.gradeBands.forEach(function (b) {
        out.push('<div class="grade-band"><div class="range">' + esc(b.range) + '</div><div class="label">' + esc(b.label) + '</div></div>');
      });
      out.push('</div>');
    }
    out.push('<p><strong>طريقة الحساب:</strong> ' + esc(d.calcMethod) + '</p>');

    out.push('<h2>' + esc(d.reportTitle) + '</h2>');
    (d.reportSections || []).forEach(function (r) {
      out.push('<h3>• ' + esc(r) + '</h3><div class="report-box"></div>');
    });

    out.push('<h2>' + esc(d.signaturesTitle) + '</h2>');
    out.push('<table class="signature-table"><tr>');
    (d.signatures || []).forEach(function (sig) {
      out.push('<td><strong>' + esc(sig.label) + ':</strong><br><br>' + esc(sig.value || '...................') + '</td>');
    });
    out.push('</tr></table>');

    if (d.footer) out.push('<div class="footer-text">' + esc(d.footer) + '</div>');
    return out.join('\n');
  }
})();
</script>
</body>
</html>
